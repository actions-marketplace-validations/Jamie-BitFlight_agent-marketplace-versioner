name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prek:
    name: Prek hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked prek run --all-files

  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff format --check

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ruff check --no-fix --output-format=github

  typecheck-ty:
    name: Type Checking (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked ty check packages/ --output-format github

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=packages/agent_marketplace_versioner --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 30

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked mkdocs build --strict

  integration:
    name: Distributed hooks and composite action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: versioner
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Exercise both hook runners
        working-directory: versioner
        run: uv run --locked pytest tests/test_integrations.py -n 0 --no-cov
      - name: Prepare consumer
        id: consumer
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: uv run versioner/tests/integration_consumer.py prepare "$CONSUMER" >> "$GITHUB_OUTPUT"
      - name: Reject an unversioned committed change
        id: reject
        continue-on-error: true
        uses: ./versioner
        with:
          repository: ${{ runner.temp }}/consumer
          base-ref: ${{ steps.consumer.outputs.base }}
          head-ref: HEAD
      - name: Check rejection and stage a change
        env:
          OUTCOME: ${{ steps.reject.outcome }}
          CONSUMER: ${{ runner.temp }}/consumer
        run: |
          test "$OUTCOME" = failure
          uv run versioner/tests/integration_consumer.py stage "$CONSUMER"
      - name: Synchronize staged versions
        uses: ./versioner
        with:
          command: sync
          repository: ${{ runner.temp }}/consumer
      - name: Repeat synchronization
        uses: ./versioner
        with:
          command: sync
          repository: ${{ runner.temp }}/consumer
      - name: Verify one bump and commit it
        env:
          CONSUMER: ${{ runner.temp }}/consumer
        run: uv run versioner/tests/integration_consumer.py verify "$CONSUMER"
      - name: Accept the versioned change
        uses: ./versioner
        with:
          repository: ${{ runner.temp }}/consumer
          base-ref: ${{ steps.consumer.outputs.base }}
          head-ref: HEAD

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml
          path: coverage-reports
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await (await import(`${process.env.GITHUB_WORKSPACE}/scripts/post_coverage_summary.mjs`)).default({ github, context })

  release:
    name: Tag and Release
    needs: [prek, format, lint, typecheck-ty, test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # github-tag-action parses commits with the Angular preset, which ignores `type!:` breaking
      # subjects. Derive the major bump here, and honour an explicit `Release-As: X.Y.Z` footer.
      - id: bump
        name: Detect breaking and explicit release versions
        run: |
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null)" || exit 0
          bodies="$(git log --format=%B "${last}..HEAD")"
          subjects="$(git log --format=%s "${last}..HEAD")"
          release_as="$(grep -m 1 -oE '^Release-As: v?[0-9]+\.[0-9]+\.[0-9]+$' <<<"$bodies" || true)"
          release_as="${release_as#Release-As: }"
          release_as="${release_as#v}"
          if [[ -z "$release_as" ]] && grep -qE '^[a-z]+(\([^)]*\))?!: ' <<<"$subjects"; then
            major="${last#v}"
            release_as="$((${major%%.*} + 1)).0.0"
          fi
          echo "custom_tag=${release_as}" >> "$GITHUB_OUTPUT"
      - id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.bump.outputs.custom_tag }}
          default_bump: false
          create_annotated_tag: true
          custom_release_rules: 'refactor:patch,perf:patch'
      - name: Advance v1 compatibility tag
        if: steps.tag_version.outputs.new_tag
        env:
          RELEASE_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v1\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 0
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force --annotate v1 "$release_commit" --message "v1 -> ${RELEASE_TAG}"
          git push --force origin refs/tags/v1
      - if: steps.tag_version.outputs.new_tag
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.RELEASE_TOKEN }}
