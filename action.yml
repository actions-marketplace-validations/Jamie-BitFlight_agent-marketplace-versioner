name: Agent Marketplace Versioner
description: Keep agent plugin and marketplace versions in sync across Codex, Claude Code, and other harnesses.
branding:
  icon: refresh-cw
  color: purple
inputs:
  command:
    description: CLI command to run (check, audit, sync, repair, or reconcile). Only check and audit are read-only.
    default: check
  marketplace:
    description: Set to true with command sync to reconcile and version marketplace catalogs.
    default: "false"
  repository:
    description: Consumer Git repository directory.
    default: ${{ github.workspace }}
  base-ref:
    description: Base revision for check. The checkout must contain this revision.
    default: ${{ github.event.pull_request.base.sha || github.event.before }}
  head-ref:
    description: Candidate revision for check.
    default: ${{ github.event.pull_request.head.sha || github.sha }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.12"
        enable-cache: false
    - name: Run marketplace versioner
      shell: bash
      env:
        VERSIONER_SOURCE: ${{ github.action_path }}
        VERSIONER_REPOSITORY: ${{ inputs.repository }}
        VERSIONER_COMMAND: ${{ inputs.command }}
        VERSIONER_MARKETPLACE: ${{ inputs.marketplace }}
        VERSIONER_BASE: ${{ inputs.base-ref }}
        VERSIONER_HEAD: ${{ inputs.head-ref }}
        VERSIONER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SETUPTOOLS_SCM_PRETEND_VERSION: 0+action
      run: |
        # A new-branch push reports an all-zero `before` SHA; treat it as no base.
        if [[ "$VERSIONER_BASE" =~ ^0+$ ]]; then
          VERSIONER_BASE=""
        fi
        args=("$VERSIONER_COMMAND")
        case "$VERSIONER_COMMAND" in
          check)
            if [[ -z "$VERSIONER_BASE" && -n "$VERSIONER_DEFAULT_BRANCH" ]]; then
              VERSIONER_BASE="origin/$VERSIONER_DEFAULT_BRANCH"
            fi
            if [[ -n "$VERSIONER_BASE" ]]; then
              args+=(--base-ref "$VERSIONER_BASE")
            fi
            args+=(--head-ref "$VERSIONER_HEAD")
            ;;
          sync)
            if [[ "$VERSIONER_MARKETPLACE" == "true" ]]; then
              args+=(--marketplace)
              if [[ -n "$VERSIONER_BASE" ]]; then
                args+=(--base-ref "$VERSIONER_BASE" --head-ref "$VERSIONER_HEAD")
              fi
            fi
            ;;
          audit|repair|reconcile) ;;
          *)
            echo "Unsupported command: $VERSIONER_COMMAND" >&2
            exit 2
            ;;
        esac
        VERSIONER_ENV=$(mktemp -d "$RUNNER_TEMP/agent-marketplace-versioner.XXXXXX")
        export UV_PROJECT_ENVIRONMENT="$VERSIONER_ENV"
        uv sync --project "$VERSIONER_SOURCE" --locked --no-dev --no-editable
        cd "$VERSIONER_REPOSITORY"
        "$VERSIONER_ENV/bin/agent-marketplace-versioner" "${args[@]}"
